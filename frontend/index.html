<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Gestion Étudiants</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>

<body>
    <nav>
        <a href="index.html">📋 Liste Étudiants</a>
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="archives.html">🗄️ Archives</a>
        <a href="import.html">📥 Import JSON</a>
    
    </nav>
    <div class="page">
    <h1>Liste des étudiants</h1>

    <input type="text" id="searchInput" placeholder="Rechercher étudiant...">

    <div id="students-container"></div>
    <div id="pagination">
        <button id="btnPrev">← Précédent</button>
        <span id="pageInfo">Page 1</span>
        <button id="btnNext">Suivant →</button>
    </div>

    <h2>Ajouter un étudiant</h2>

    <input id="nom" placeholder="Nom">
    <input id="prenom" placeholder="Prénom">
    <input id="numero" placeholder="Numéro">
    <select id="classe">
        <option value="">-- Choisir une classe --</option>
        <option value="6emeA">6emeA</option>
        <option value="6emeB">6emeB</option>
        <option value="4emeA">4emeA</option>
        <option value="4emeB">4emeB</option>
        <option value="3emeC">3emeC</option>
    </select>

    <button id="addBtn">Ajouter</button>

    <h1>Dashboard</h1>

    <div id="stats">
        <p>Total étudiants: <span id="totalEtudiants">....</span></p>
        <p>Moyenne générale: <span id="moyenneGenerale">....</span></p>
        <p>Total notes: <strong id="totalNotes">.....</strong></p>
    </div>
    </div>
</body>
</html>
