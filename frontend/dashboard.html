<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Dashboard - Gestion Étudiants</title>
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js depuis CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<nav>
    <a href="index.html">📋 Liste Étudiants</a>

<body>

    <h1>📊 Dashboard</h1>
    <a href="index.html">← Retour à la liste</a>

    <!-- ===================== -->
    <!-- KPI GLOBAUX           -->
    <!-- ===================== -->
    <div id="kpi-container">
        <div class="kpi-card">
            <h3>Total Étudiants</h3>
            <p id="totalEtudiants">...</p>
        </div>
        <div class="kpi-card">
            <h3>Moyenne Générale</h3>
            <p id="moyenneGenerale">...</p>
        </div>
        <div class="kpi-card">
            <h3>Total Notes</h3>
            <p id="totalNotes">...</p>
        </div>
    </div>

    <!-- ===================== -->
    <!-- GRAPHIQUE PAR CLASSE  -->
    <!-- ===================== -->
    <h2>Moyenne par classe</h2>
    <canvas id="chartClasses"></canvas>

    <!-- ===================== -->
    <!-- TOP 10                -->
    <!-- ===================== -->
    <h2>Top 10 étudiants</h2>
    <canvas id="chartTop10"></canvas>

    <script src="dashboard.js"></script>
